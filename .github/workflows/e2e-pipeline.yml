name: ServeRest E2E Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. LINT (Quality Gate Inicial - Bloqueia o avanço em caso de falha)
  lint:
    name: Linter - Análise de Código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --no-audit --fund --loglevel error

      - name: Executar Linter
        run: npm run lint

  # 2. TESTES DE API (Executa após o Lint passar)
  test-api:
    name: Suíte de Testes - API
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --no-audit --fund --loglevel error

      - name: Executar Testes de API
        run: npm run test:api

      - name: Publicar Relatório, Screenshots, Vídeos e XML (API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-api
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
            cypress/results/

  # 3. TESTES DE FRONTEND EM MATRIZ MULTI-BROWSER VIA DOCKER (Chrome, Edge, Electron)
  test-frontend:
    name: Suite de Testes - Frontend (${{ matrix.browser }})
    needs: test-api
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, electron]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --no-audit --fund --loglevel error

      - name: Executar Testes de Frontend
        run: npx cypress run --spec 'cypress/e2e/features/frontend/**/*.feature' --browser ${{ matrix.browser }}

      - name: Publicar Relatório, Screenshots, Vídeos e XML (Frontend - ${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-frontend-${{ matrix.browser }}
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
            cypress/results/

  # 4. TESTES VISUAIS COM PERCY (Executa após a matrix de frontend e antes da performance)
  test-visual:
    name: Suite de Testes - Visuais (Percy)
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --no-audit --fund --loglevel error

      - name: Executar Testes Visuais com Percy
        run: npx percy exec -- npx cypress run --spec 'cypress/e2e/features/visual/**/*.feature'
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

      - name: Publicar Screenshots, Vídeos e XML (Visual Percy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-visual
          path: |
            cypress/screenshots/
            cypress/videos/
            cypress/results/

  # 5. TESTES DE PERFORMANCE (Executa após os testes visuais do Percy)
  test-performance:
    name: Suite de Testes - Performance
    needs: test-visual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --no-audit --fund --loglevel error

      - name: Executar Testes de Performance
        run: npx cypress run --spec 'cypress/e2e/features/performance/**/*.feature' --browser chrome

      - name: Publicar Relatório, Screenshots, Vídeos e XML (Performance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-performance
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
            cypress/results/

  # 6. ENVIAR MÉTRICAS PARA O GRAFANA CLOUD
  grafana-metrics:
    name: Publicar Métricas no Grafana
    needs: [test-api, test-frontend, test-visual, test-performance]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar todos os artefatos de teste
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enviar Resultados JUnit para o Grafana Cloud
        env:
          CLEAN_GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          CLEAN_GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            function getAllFiles(dirPath, arrayOfFiles) {
              const files = fs.readdirSync(dirPath);
              arrayOfFiles = arrayOfFiles || [];
              files.forEach(file => {
                if (fs.statSync(dirPath + "/" + file).isDirectory()) {
                  arrayOfFiles = getAllFiles(dirPath + "/" + file, arrayOfFiles);
                } else if (file.endsWith(".xml")) {
                  arrayOfFiles.push(path.join(dirPath, file));
                }
              });
              return arrayOfFiles;
            }

            async function run() {
              try {
                const xmlFiles = getAllFiles("all-artifacts");
                console.log(`Encontrados ${xmlFiles.length} relatórios JUnit XML.`);
                
                let totalTests = 0;
                let totalFailures = 0;

                xmlFiles.forEach(file => {
                  const content = fs.readFileSync(file, "utf8");
                  const testsMatch = content.match(/tests="(\d+)"/);
                  const failuresMatch = content.match(/failures="(\d+)"/);
                  
                  if (testsMatch) totalTests += parseInt(testsMatch[1], 10);
                  if (failuresMatch) totalFailures += parseInt(failuresMatch[1], 10);
                });

                const totalPassed = totalTests - totalFailures;
                console.log(`Métricas consolidadas -> Testes: ${totalTests}, Sucessos: ${totalPassed}, Falhas: ${totalFailures}`);

                const metricsPayload = `
                  serverest_tests_total{environment="ci"} ${totalTests}
                  serverest_tests_passed{environment="ci"} ${totalPassed}
                  serverest_tests_failures{environment="ci"} ${totalFailures}
                `.trim();

                const grafanaUrl = (process.env.CLEAN_GRAFANA_URL || "").replace(/[\r\n\s]+/g, "");
                const token = (process.env.CLEAN_GRAFANA_TOKEN || "").replace(/[\r\n\s]+/g, "");

                if (!grafanaUrl || !token) {
                  console.log("Credenciais do Grafana ausentes. Pulando envio.");
                  return;
                }

                console.log("Enviando métricas para URL limpa...");
                
                const response = await fetch(grafanaUrl, {
                  method: "POST",
                  headers: {
                    "Content-Type": "text/plain",
                    "Authorization": `Bearer ${token}`
                  },
                  body: metricsPayload
                });

                if (response.ok) {
                  console.log("Métricas enviadas com sucesso para o Grafana Cloud!");
                } else {
                  const errorText = await response.text();
                  console.warn("Aviso ao enviar métricas:", response.status, errorText);
                }

              } catch (error) {
                console.error("Erro ao processar relatórios para o Grafana:", error);
                process.exit(1);
              }
            }

            run();
          '