name: ServeRest E2E Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. LINT (Quality Gate Inicial - Bloqueia o avanço em caso de falha)
  lint:
    name: Executar Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Linter
        run: npm run lint

  # 2. TESTES DE API (Executa em paralelo, independente de browser)
  test-api:
    name: Suíte de Testes - API
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Testes de API
        run: npm run test:api

      - name: Publicar Relatório Mochawesome (API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-api
          path: cypress/reports/

  # 3. TESTES DE FRONTEND EM MATRIZ MULTI-BROWSER
  test-frontend:
    name: Frontend (${{ matrix.browser }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Testes de Frontend
        run: npx cypress run --browser ${{ matrix.browser }} --env grepTags=@frontend # ou o comando configurado no package.json adaptado para aceitar a flag --browser

      - name: Publicar Relatório Mochawesome (Frontend - ${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-frontend-${{ matrix.browser }}
          path: cypress/reports/