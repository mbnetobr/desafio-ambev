name: ServeRest E2E Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  setup:
    name: Setup & Instalar Dependências
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Node Modules e Cypress Binary
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Cypress
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências (caso não esteja em cache)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

  lint:
    name: Executar Linter
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restaurar Cache de Dependências
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Cypress
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}

      - name: Linter
        run: npm run lint

  test-api:
    name: Suíte de Testes - API
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restaurar Cache de Dependências
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Cypress
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}

      - name: Executar Testes de API
        run: npm run test:api

      - name: Publicar Relatório Mochawesome (API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-api
          path: cypress/reports/

  test-frontend:
    name: Suíte de Testes - Frontend
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restaurar Cache de Dependências
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Cypress
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}

      - name: Executar Testes de Frontend
        run: npm run test:frontend

      - name: Publicar Relatório Mochawesome (Frontend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-frontend
          path: cypress/reports/