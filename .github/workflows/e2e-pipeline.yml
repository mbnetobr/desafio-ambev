name: ServeRest E2E Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. LINT (Quality Gate Inicial - Bloqueia o avanço em caso de falha)
  lint:
    name: Linter - Análise de Código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Linter
        run: npm run lint

  # 2. TESTES DE API (Executa após o Lint passar)
  test-api:
    name: Suíte de Testes - API
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Testes de API
        run: npm run test:api

      - name: Publicar Relatório Mochawesome (API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-api
          path: cypress/reports/

  # 3. TESTES DE FRONTEND EM MATRIZ MULTI-BROWSER VIA DOCKER (Chrome, Edge, Electron)
  test-frontend:
    name: Suite de Testes - Frontend (${{ matrix.browser }})
    needs: test-api
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, electron]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Testes de Frontend
        run: npx cypress run --spec 'cypress/e2e/features/frontend/**/*.feature' --browser ${{ matrix.browser }}

      - name: Publicar Relatório Mochawesome (Frontend - ${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-frontend-${{ matrix.browser }}
          path: cypress/reports/

  # 4. TESTES DE PERFORMANCE (Executa após o sucesso da matriz multi-browser de frontend)
  test-performance:
    name: Suite de Testes - Performance
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Testes de Performance
        run: npx cypress run --spec 'cypress/e2e/features/performance/**/*.feature' --browser chrome

      - name: Publicar Relatório Mochawesome (Performance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-performance
          path: cypress/reports/